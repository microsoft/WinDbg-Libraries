
trigger:
- master

pr: none

pool:
  vmImage: ubuntu-latest

steps:

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.0.413'

- script: dotnet pack DbgModelCppLib.csproj --configuration Release
  displayName: 'Pack NuGet with dotnet CLI'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

